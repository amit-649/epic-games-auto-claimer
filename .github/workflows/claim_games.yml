name: Epic Games Weekly Auto-Claimer (Thursday & Friday 10:00 PM IST)

on:
  schedule:
    # Thursday 16:30 UTC = 10:00 PM IST (30 min after Epic Games free drop at 11:00 AM EST)
    - cron: '30 16 * * 4'
    # Friday 16:30 UTC = 10:00 PM IST (Backup check to guarantee no title is missed)
    - cron: '30 16 * * 5'
  workflow_dispatch:
    inputs:
      headless:
        description: 'Run in headless mode'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: epic-auto-claimer
  cancel-in-progress: false

jobs:
  claim-games:
    name: Claim Free Epic Games
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore Browser Profile Cache
        uses: actions/cache@v4
        with:
          path: ./epic_browser_data
          key: epic-browser-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            epic-browser-data-${{ runner.os }}-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium & System Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Epic Games Auto-Claimer
        env:
          EPIC_EMAIL: ${{ secrets.EPIC_EMAIL }}
          EPIC_PASSWORD: ${{ secrets.EPIC_PASSWORD }}
          EPIC_TOTP_SECRET: ${{ secrets.EPIC_TOTP_SECRET }}
          EPIC_SESSION_BASE64: ${{ secrets.EPIC_SESSION_BASE64 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          HEADLESS_MODE: ${{ github.event.inputs.headless || 'true' }}
          CI: 'true'
          GITHUB_ACTIONS: 'true'
        run: |
          python bot.py

      - name: Upload Logs & Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epic-bot-artifacts-${{ github.run_number }}
          path: |
            bot.log
            claimed_games_lite.csv
            epic_session.json
            *.png
          retention-days: 7
          if-no-files-found: ignore
